<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eToolsCode Pro</title>
  <style>
    :root { --bg:#0a1120; --panel:#111c33; --border:#1e2e4e; --text:#e2e8f0; --muted:#8b9bb4; --green:#00aa4f; }
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family: system-ui,sans-serif; }
    .pro-header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .pro-header h1 { font-size:1rem; margin:0; margin-right:8px; }
    .pro-header label { font-size:0.75rem; color:var(--muted); }
    .pro-header select, .pro-header input, .pro-header button {
      background:#1c2b4a; color:var(--text); border:1px solid #2c3e5a; border-radius:6px; padding:6px 10px; font-size:0.85rem;
    }
    .pro-header button { cursor:pointer; }
    .pro-header button.primary { background:var(--green); border:none; color:#fff; font-weight:600; }
    .pro-header button.primary:hover { filter:brightness(1.08); }
    .pro-grid { flex:1; display:grid; grid-template-columns: 240px 1fr 300px; min-height:0; }
    .pro-col { border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
    .pro-col:last-child { border-right:none; }
    .pro-col h2 { margin:0; padding:10px 12px; font-size:0.72rem; letter-spacing:0.06em; color:var(--muted); border-bottom:1px solid var(--border); text-transform:uppercase; }
    .pro-body { flex:1; overflow:auto; padding:8px; font-size:13px; }
    #fileList .file { padding:6px 8px; border-radius:4px; cursor:pointer; color:#9fb0c7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #fileList .file:hover, #fileList .file.active { background:rgba(0,170,79,0.15); color:#f0fdf4; }
    #diffEditor { flex:1; min-height:0; }
    #logPane { font-family: ui-monospace, monospace; font-size:12px; color:#94a3b8; white-space:pre-wrap; }
    .status-pill { font-size:0.75rem; color:#64748b; }
    a.home { color:var(--muted); text-decoration:none; font-size:0.8rem; }
    a.home:hover { color:var(--green); }
  </style>
</head>
<body>
  <header class="pro-header">
    <h1>eToolsCode Pro</h1>
    <a class="home" href="/">← UI clássica</a>
    <label>Projeto
      <select id="projectSelect"><option value="">— selecione —</option></select>
    </label>
    <span class="status-pill" id="branchInfo">—</span>
    <input id="branchName" placeholder="dsac/projeto/issue" style="width:180px">
    <button class="primary" id="btnBranch">Criar branch</button>
    <button id="btnRefresh">Atualizar</button>
  </header>
  <div class="pro-grid">
    <section class="pro-col">
      <h2>Arquivos modificados</h2>
      <div class="pro-body" id="fileList"></div>
    </section>
    <section class="pro-col">
      <h2>Diff (HEAD × working tree)</h2>
      <div id="diffEditor"></div>
    </section>
    <section class="pro-col">
      <h2>Audit / timeline</h2>
      <div class="pro-body" id="logPane">Selecione um projeto…</div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="/static/js/app_pro.js"></script>
</body>
</html>
