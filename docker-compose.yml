services:
  etoolscode:
    build: .
    image: etoolscode:latest
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      DSAC_UI_AUTH: ${DSAC_UI_AUTH:-off}
      DSAC_UI_PASSWORD_HASH: ${DSAC_UI_PASSWORD_HASH:-}
      LLM_CLIENT: ${LLM_CLIENT:-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ETOOLSCODE_KEY: ${ETOOLSCODE_KEY:-}
      ISSUES_DIR: /data/issues
    volumes:
      - etoolscode-data:/data
      # monte seus projetos locais, ex:
      # - ${HOME}/prj:/data/prj:ro
    restart: unless-stopped

volumes:
  etoolscode-data:
